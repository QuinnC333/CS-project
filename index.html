<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Connect Four vs AI</title>
        <style>
            img{
                display: block;
                margin: auto;
                width: 40%;
            }
            h1{
                margin-top: 25px;
                margin-bottom: 40px;
                text-align: center;
            }
            .myButton{
                border: 4px solid black;
                color: black;
                background-color: rgb(225, 225, 225);
                text-align: center;
                display: inline-block;
                font-size: large;
                padding: 10px;
                cursor: pointer;
            }
            .myButton:hover{
                background-color: rgb(166, 166, 166);
            }
            .container{
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 20px;
            }
            .gameBoard{
                height: 575px;
                width: 791px;
                background-image: url('GameBoard.png');
                display: flex;
                justify-content: center;
                align-items: center;
                margin: auto;
            }
            .columnButton{
                border: none;
                background-color: transparent;
                width: 86px;
                height: 570px;
                margin-top: 2.5px;
                margin-bottom: 2.5px;
                margin-left: 4px;
                margin-right: 4px;
            }
            .columnButton:hover{
                background-color: rgba(67, 67, 67, 0.45);
            }
        </style>
    </head>
    <body style="background-color: beige;">
        <h1>Connect Four vs AI</h1>

        <div class="gameBoard">
            <button class="columnButton"></button>
            <button class="columnButton"></button>
            <button class="columnButton"></button>
            <button class="columnButton"></button>
            <button class="columnButton"></button>
            <button class="columnButton"></button>
            <button class="columnButton"></button>
        </div>
        
        <div class="container">
            <button class="myButton">Restart</button>
        </div>
    </body>
</html>
